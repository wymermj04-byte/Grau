
name: Promotion notification worker

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: Select the worker response contract to verify
        required: true
        type: choice
        options:
          - disabled-state-test
          - controlled-delivery-test
      delivery_confirmation:
        description: Required only for controlled delivery; enter controlled-delivery-test
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

concurrency:
  group: main-promotion-notification-worker
  cancel-in-progress: false

jobs:
  invoke-worker:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.test_mode == 'disabled-state-test' ||
         (inputs.test_mode == 'controlled-delivery-test' &&
          inputs.delivery_confirmation == 'controlled-delivery-test')))
    runs-on: ubuntu-latest
    environment: main-supabase-worker
    timeout-minutes: 2

    steps:
      - name: Invoke and validate promotion notification worker
        env:
          WORKER_URL: ${{ vars.SUPABASE_PROMOTION_WORKER_URL }}
          WORKER_SECRET_KEY: ${{ secrets.SUPABASE_PROMOTION_WORKER_SECRET_KEY }}
          TEST_MODE: ${{ inputs.test_mode }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$WORKER_URL" ] || [ -z "$WORKER_SECRET_KEY" ]; then
            echo "Worker configuration is missing."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --max-time 30 \
              --request POST \
              --header "apikey: ${WORKER_SECRET_KEY}" \
              "$WORKER_URL"
          )"

          if [ "$http_status" != "200" ]; then
            echo "Worker returned unexpected HTTP status: ${http_status}."
            exit 1
          fi

          if ! jq -e 'type == "object"' "$response_file" >/dev/null 2>&1; then
            echo 'Worker response diagnostic: {"json_object":false}'
            exit 1
          fi

          jq -c '
            . as $root
            | {
                json_object: true,
                key_count: (keys | length),
                has_ok: has("ok"),
                ok_is_boolean: (
                  if has("ok") then (.ok | type == "boolean") else false end
                ),
                has_disabled: has("disabled"),
                disabled_is_boolean: (
                  if has("disabled") then (.disabled | type == "boolean") else false end
                ),
                has_result: has("result"),
                result_is_object: (
                  if has("result") then (.result | type == "object") else false end
                ),
                counter_fields_are_nonnegative_integers: (
                  if (
                    $root | has("result") and (.result | type == "object")
                  ) then
                    ["processed", "delivered", "retried", "dead_lettered"]
                    | all(
                        .[]; . as $name
                        | ($root.result[$name]
                          | if type == "number" then floor == . and . >= 0 else false end
                        )
                      )
                  else false
                  end
                )
              }
          ' "$response_file"

          disabled_contract='
            type == "object" and
            .ok == true and
            .disabled == true and
            (keys | length == 2)
          '

          enabled_contract='
            type == "object" and
            .ok == true and
            (keys | length == 2) and
            (.result | type == "object") and
            (.result | (keys | sort) == ["dead_lettered", "delivered", "processed", "retried"]) and
            (. as $root
              | ["processed", "delivered", "retried", "dead_lettered"]
              | all(
                  .[]; . as $name
                  | ($root.result[$name]
                    | if type == "number" then floor == . and . >= 0 else false end
                  )
                )
            )
          '

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TEST_MODE" = "disabled-state-test" ]; then
              if ! jq -e "$disabled_contract" "$response_file" >/dev/null; then
                echo "Worker did not confirm the disabled-state contract."
                exit 1
              fi
              echo "Disabled-state contract: PASS"
              exit 0
            fi

            if ! jq -e "$enabled_contract" "$response_file" >/dev/null; then
              echo "Worker did not return a valid enabled-state aggregate contract."
              exit 1
            fi
            echo "Controlled-delivery aggregate contract: PASS"
            exit 0
          fi

          if jq -e "$disabled_contract" "$response_file" >/dev/null; then
            echo "Scheduled disabled-state no-op: PASS"
            exit 0
          fi

          if jq -e "$enabled_contract" "$response_file" >/dev/null; then
            echo "Scheduled enabled-state aggregate contract: PASS"
            exit 0
          fi

          echo "Worker did not return a recognized response contract."
          exit 1
